vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }

// --- bubble life cycle ----------------------------------------
// phase in [0,1): 0..grow -> dome inflates; hold; pop -> collapse + crater; heal
// popT must satisfy popT + 0.25 <= 1.0 so the cycle is continuous across wrap
float bubbleAmp(float phase, float popT, out float membrane){
  float grow    = smoothstep(0.0, 0.45, phase);
  float popped  = smoothstep(popT, popT + 0.04, phase);
  float crater  = smoothstep(popT, popT + 0.05, phase) * (1.0 - smoothstep(popT + 0.05, popT + 0.25, phase));
  membrane = smoothstep(0.30, popT - 0.02, phase) * (1.0 - popped);
