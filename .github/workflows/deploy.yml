name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Encrypts the curriculum for /learn with the LEARN_PASSPHRASE secret. Without the secret it
      # writes nothing and /learn says it isn't set up. A failure here must not block the rest of
      # the site, and the script writes nothing unless it fully succeeds, so plaintext can't leak.
      - name: Build encrypted /learn bundle
        run: npm run learn:build
        continue-on-error: true
        env:
          LEARN_PASSPHRASE: ${{ secrets.LEARN_PASSPHRASE }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
