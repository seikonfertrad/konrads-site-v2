name = "learn-sync"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://konrads.link"
# How many vaults may exist. One person, a couple of passphrase changes.
MAX_VAULTS = "3"

[[d1_databases]]
binding = "DB"
database_name = "learn-sync"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
